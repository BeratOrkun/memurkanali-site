<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı – Memur Kanalı</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f5fb; color: #0f172a; text-align: center; padding: 24px; }
    @media (prefers-color-scheme: dark) { body { background: #0a1020; color: #e8edf7; } }
    a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 14px; background: #2b50e6; color: #fff; text-decoration: none; font-weight: 700; }
    h1 { font-size: 1.6rem; margin: 12px 0 6px; }
    p { opacity: .75; margin: 0; }
  </style>
</head>
<body>
  <main>
    <div style="font-size:3rem">🧭</div>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı değişmiş olabilir. Güncel kamu ilanları ana sayfada.</p>
    <a href="/" id="ana">Ana sayfaya git</a>
  </main>
  <script>
    // Proje sitelerinde (kullanici.github.io/memurkanali/) doğru köke yönlendir
    var p = location.pathname.split("/").filter(Boolean);
    if (location.hostname.endsWith("github.io") && p.length) document.getElementById("ana").href = "/" + p[0] + "/";
  </script>
</body>
</html>
